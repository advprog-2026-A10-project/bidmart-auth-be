name: cd-docker

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      CONTAINER_NAME: bidmart-auth-be
      CONTAINER_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build image (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local-scan:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local-scan:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-ec2:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      CONTAINER_NAME: bidmart-auth-be
      HOST_PORT: 80
      CONTAINER_PORT: 8080
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      APP_SERVER_HOST: ${{ secrets.APP_SERVER_HOST }}
      APP_SERVER_PORT: ${{ secrets.APP_SERVER_PORT }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      APP_AUTH_JWT_SECRET: ${{ secrets.APP_AUTH_JWT_SECRET }}
      APP_RESEND_API_KEY: ${{ secrets.APP_RESEND_API_KEY }}
      APP_RESEND_FROM_EMAIL: ${{ secrets.APP_RESEND_FROM_EMAIL }}
      APP_VERIFY_EMAIL_URL_BASE: ${{ secrets.APP_VERIFY_EMAIL_URL_BASE }}
      APP_PASSWORD_RESET_URL_BASE: ${{ secrets.APP_PASSWORD_RESET_URL_BASE }}
      APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
    steps:
      - name: Check deploy prerequisites
        id: deploy_gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${EC2_HOST:-}" \
            && -n "${EC2_USER:-}" \
            && -n "${EC2_SSH_KEY:-}" \
            && -n "${APP_DATABASE_URL:-}" \
            && -n "${APP_AUTH_JWT_SECRET:-}" \
            && -n "${APP_RESEND_API_KEY:-}" \
            && -n "${APP_RESEND_FROM_EMAIL:-}" \
            && -n "${APP_VERIFY_EMAIL_URL_BASE:-}" \
            && -n "${APP_PASSWORD_RESET_URL_BASE:-}" \
            && -n "${APP_CORS_ALLOWED_ORIGINS:-}" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "EC2 or application runtime secrets are not fully configured. Skipping deployment step."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSH
        if: steps.deploy_gate.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,APP_SERVER_HOST,APP_SERVER_PORT,APP_DATABASE_URL,APP_AUTH_JWT_SECRET,APP_RESEND_API_KEY,APP_RESEND_FROM_EMAIL,APP_VERIFY_EMAIL_URL_BASE,APP_PASSWORD_RESET_URL_BASE,APP_CORS_ALLOWED_ORIGINS
          script: |
            set -euo pipefail
            server_host="${APP_SERVER_HOST:-0.0.0.0}"
            server_port="${APP_SERVER_PORT:-$CONTAINER_PORT}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${IMAGE}"
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              docker rm -f "${CONTAINER_NAME}"
            fi
            docker run -d --restart unless-stopped \
              --name "${CONTAINER_NAME}" \
              -p "${HOST_PORT}:${CONTAINER_PORT}" \
              -e APP_SERVER_HOST="${server_host}" \
              -e APP_SERVER_PORT="${server_port}" \
              -e APP_DATABASE_URL="${APP_DATABASE_URL}" \
              -e APP_AUTH_JWT_SECRET="${APP_AUTH_JWT_SECRET}" \
              -e APP_RESEND_API_KEY="${APP_RESEND_API_KEY}" \
              -e APP_RESEND_FROM_EMAIL="${APP_RESEND_FROM_EMAIL}" \
              -e APP_VERIFY_EMAIL_URL_BASE="${APP_VERIFY_EMAIL_URL_BASE}" \
              -e APP_PASSWORD_RESET_URL_BASE="${APP_PASSWORD_RESET_URL_BASE}" \
              -e APP_CORS_ALLOWED_ORIGINS="${APP_CORS_ALLOWED_ORIGINS}" \
              "${IMAGE}"
